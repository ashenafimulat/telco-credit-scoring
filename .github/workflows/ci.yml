name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ["3.10", "3.12"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: pip install -r requirements.txt
      - run: ruff check src api tests
      - run: pytest -q          # includes DuckDB-vs-pandas parity and FastAPI tests
      - name: Smoke-run the whole pipeline on a small sample
        run: python -m src.pipeline --n-customers 800
      - uses: actions/upload-artifact@v4
        with: {name: reports, path: reports/}
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t telco-credit-scoring .
