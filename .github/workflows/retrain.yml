name: Scheduled monitoring and retraining
on:
  schedule: [{cron: "0 6 1 * *"}]     # 06:00 UTC on the 1st of every month
  workflow_dispatch: {}
jobs:
  monitor-and-retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Rebuild data + model (demo uses synthetic data; production would read the warehouse)
        run: python -m src.pipeline
      - name: Monitor and retrain if drift is detected
        run: python -m src.retrain
      - uses: actions/upload-artifact@v4
        with: {name: monitoring-and-retrain, path: reports/}
